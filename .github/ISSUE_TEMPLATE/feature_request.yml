name: Feature request
description: Suggest an improvement to Familiar Desktop.
body:
  - type: markdown
    attributes:
      value: Please check existing requests first. Tell us about the task you want to make easier.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or missing capability in your everyday use.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should Familiar help?
      description: Explain the behaviour you would like. A sketch or example is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?
      description: Any workaround, alternatives, or related requests.
  - type: textarea
    id: context
    attributes:
      label: Other context
      description: Relevant apps, desktop setup, or Familiar version.
